name: Release Program Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Record release source commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Build guest program binaries
        run: make build-programs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Verify generated IDLs
        run: |
          set -euo pipefail
          cargo build -p idl-gen --release
          for source in programs/*/methods/guest/src/bin/*.rs; do
            program="$(basename "${source}" .rs)"
            target/release/idl-gen "${source}" > "${RUNNER_TEMP}/${program}-idl.json"
            diff -u "artifacts/${program}-idl.json" "${RUNNER_TEMP}/${program}-idl.json"
          done

      - name: Package release assets
        run: |
          python3 scripts/program-release.py package \
            --tag "${GITHUB_REF_NAME}" \
            --source-commit "${SOURCE_COMMIT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output-dir dist/release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --generate-notes \
            --title "LEZ programs ${GITHUB_REF_NAME}" \
            --verify-tag \
            dist/release/*

      - name: Download and verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-download"
          gh release download "${GITHUB_REF_NAME}" \
            --dir "${RUNNER_TEMP}/release-download"
          python3 scripts/program-release.py verify \
            --tag "${GITHUB_REF_NAME}" \
            --source-commit "${SOURCE_COMMIT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --assets-dir "${RUNNER_TEMP}/release-download"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release edit "${GITHUB_REF_NAME}" \
            --draft=false \
            "${prerelease[@]}"
