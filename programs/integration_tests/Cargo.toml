[package]
name = "integration_tests"
version = "0.1.0"
edition = "2021"
# Each program's test file returns as a target with its port to the actor model; until
# then it stays in tests/ unbuilt.
autotests = false

[lints]
workspace = true

[[test]]
name = "token"
path = "tests/token.rs"

[[test]]
name = "nft"
path = "tests/nft.rs"

[dependencies]
borsh = { workspace = true }
lee = { workspace = true }
lee_core = { workspace = true, features = ["host", "test_utils"] }
token_core = { workspace = true }
token-methods = { path = "../token/methods" }
nft_core = { workspace = true }
nft-methods = { path = "../nft/methods" }

[[test]]
name = "token_composition"
path = "tests/token_composition.rs"

[[test]]
name = "token_redemption"
path = "tests/token_redemption.rs"

[dev-dependencies]
token-redemption-example = { path = "../token/examples/redemption" }
token-composition-example = { path = "../token/examples/composition" }
